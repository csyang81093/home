<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rimba Games</title>
<style>
  html,body{margin:0;height:100%;background:#0d1f14;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ============================================================
   RIMBA GAMES — three jungle mini-games set in Sarawak, Borneo.
   Starring Oren the Orangutan. Everything is drawn in code.
   ============================================================ */

// ---------- canvas & scaling (fixed 960x540 logical, letterboxed) ----------
const W = 960, H = 540, GY = 470;           // GY = ground line
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  scale = Math.min(w / W, h / H); offX = (w - W * scale) / 2; offY = (h - H * scale) / 2;
}
addEventListener('resize', resize); resize();

// ---------- utils ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const store = {
  get(k, d) { try { const v = localStorage.getItem('rimba_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('rimba_' + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- sound (tiny synth, no files) ----------
let actx = null, muted = store.get('muted', false);
function audio() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; }
function sfx(freq, dur = 0.12, type = 'sine', vol = 0.15, slide = 0) {
  if (muted) return;
  try {
    const a = audio(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function noise(dur = 0.4, vol = 0.2, freq = 900) {
  if (muted) return;
  try {
    const a = audio(), n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(); s.buffer = b;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = a.createGain(); g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination); s.start();
  } catch (e) {}
}
function fanfare() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => sfx(f, 0.18, 'triangle', 0.12), i * 110)); }

// ---------- drawing primitives ----------
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function limb(x1, y1, x2, y2, bend, w, col) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy) || 1;
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(mx - dy / l * bend, my + dx / l * bend, x2, y2); ctx.stroke();
}
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
function text(s, x, y, size = 24, col = '#fff', align = 'center', weight = '800') {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = 'rgba(14,38,20,0.9)';
  ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function label(s, x, y, size = 16, col = '#fff', align = 'center', weight = '700') {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(16,44,26,0.86)'; rr(x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,140,0.7)'; ctx.lineWidth = 2; ctx.stroke();
}

// ---------- particles ----------
class Parts {
  constructor() { this.a = []; }
  add(x, y, n, o = {}) {
    for (let i = 0; i < n; i++) {
      const ang = (o.ang ?? -Math.PI / 2) + (Math.random() - 0.5) * (o.spread ?? Math.PI);
      const sp = (o.sp || 200) * (0.4 + Math.random() * 0.8), life = (o.life || 0.8) * (0.7 + Math.random() * 0.5);
      this.a.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life, max: life, r: (o.r || 4) * (0.6 + Math.random() * 0.8), col: o.col || '#fff', g: o.g ?? 600 });
    }
  }
  update(dt) { for (const p of this.a) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; } this.a = this.a.filter(p => p.life > 0); }
  draw() { for (const p of this.a) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.col; circ(p.x, p.y, p.r); ctx.fill(); } ctx.globalAlpha = 1; }
}
function pushMsg(sc, s, col = '#ffe9a8') { sc.msgs.push({ s, t: 0, col }); }
function updMsgs(sc, dt) { for (const m of sc.msgs) m.t += dt; sc.msgs = sc.msgs.filter(m => m.t < 1.4); }
function drawMsgs(sc) {
  sc.msgs.forEach((m, i) => { ctx.globalAlpha = clamp(1.4 - m.t, 0, 1); text(m.s, W / 2, 150 - m.t * 30 + i * 36, 30, m.col); });
  ctx.globalAlpha = 1;
}

// ============================================================
//  CHARACTERS
// ============================================================
const OR = { fur: '#c9581c', dark: '#93380e', hi: '#e57a35', face: '#6e4a38', muz: '#b98a6c' };
// Oren the orangutan. (x,y) = body centre. Hands/feet are offsets from body centre.
function drawOrangutan(x, y, o = {}) {
  const s = o.s || 1;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.flip ? -1 : 1), s);
  const lh = o.lh || [-34, 22], rh = o.rh || [34, 22], lf = o.lf || [-16, 52], rf = o.rf || [16, 52];
  limb(-12, 20, lf[0], lf[1], -6, 13, OR.dark); limb(12, 20, rf[0], rf[1], 6, 13, OR.dark);
  ctx.fillStyle = OR.dark; circ(lf[0], lf[1], 7); ctx.fill(); circ(rf[0], rf[1], 7); ctx.fill();
  ctx.fillStyle = OR.fur; ell(0, 0, 26, 30); ctx.fill();
  ctx.fillStyle = OR.hi; ell(0, 5, 15, 20); ctx.fill();
  limb(-18, -18, lh[0], lh[1], -10, 12, OR.fur); limb(18, -18, rh[0], rh[1], 10, 12, OR.fur);
  ctx.fillStyle = OR.dark; circ(lh[0], lh[1], 7); ctx.fill(); circ(rh[0], rh[1], 7); ctx.fill();
  // head
  ctx.fillStyle = OR.fur; circ(0, -38, 20); ctx.fill();
  ctx.fillStyle = OR.hi; ctx.beginPath(); ctx.moveTo(-9, -54); ctx.lineTo(-3, -66); ctx.lineTo(1, -55); ctx.lineTo(7, -64); ctx.lineTo(10, -52); ctx.closePath(); ctx.fill();
  ctx.fillStyle = OR.face; ell(0, -36, 15, 14); ctx.fill();
  ctx.fillStyle = OR.muz; ell(0, -30, 10, 7); ctx.fill();
  ctx.fillStyle = '#fff'; circ(-6, -41, 3.8); ctx.fill(); circ(6, -41, 3.8); ctx.fill();
  const lk = o.look || 0;
  ctx.fillStyle = '#1b0f08'; circ(-6 + lk, -41, 2); ctx.fill(); circ(6 + lk, -41, 2); ctx.fill();
  ctx.strokeStyle = '#3a2216'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath();
  if (o.mood === 'happy') ctx.arc(0, -32, 5, 0.15 * Math.PI, 0.85 * Math.PI);
  else if (o.mood === 'oh') { ctx.arc(0, -29, 3, 0, TAU); }
  else { ctx.moveTo(-4, -29); ctx.lineTo(4, -29); }
  ctx.stroke();
  ctx.restore();
}

// Pangolin curled into a ball (it does this naturally!)
function drawPangolinBall(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#8a5a2b'; circ(0, 0, r); ctx.fill();
  ctx.strokeStyle = '#5b3816'; ctx.lineWidth = Math.max(1.2, r / 9);
  for (let ring = 0; ring < 2; ring++) {
    const rad = r * (ring ? 0.42 : 0.75), n = ring ? 5 : 9;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + ring * 0.4;
      ctx.beginPath(); ctx.arc(Math.cos(a) * rad, Math.sin(a) * rad, r * 0.26, a - 1.3, a + 1.3); ctx.stroke();
    }
  }
  ctx.fillStyle = '#e0b48a'; ell(r * 0.5, r * 0.25, r * 0.3, r * 0.22, 0.4); ctx.fill();
  ctx.fillStyle = '#111'; circ(r * 0.58, r * 0.16, Math.max(1.4, r / 9)); ctx.fill();
  ctx.restore();
}
// Pangolin standing on its hind legs, waving (they really do walk on two legs)
function drawPangolinStand(x, y, t) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#8a5a2b';
  ctx.beginPath(); ctx.moveTo(-6, -10); ctx.quadraticCurveTo(-34, -4, -40, 0); ctx.lineTo(-4, 0); ctx.closePath(); ctx.fill();
  ell(0, -26, 13, 22, 0.15); ctx.fill();
  ctx.strokeStyle = '#5b3816'; ctx.lineWidth = 1.6;
  for (let r = 0; r < 4; r++) for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.arc(-6 + i * 8, -40 + r * 9, 5, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke(); }
  ctx.fillStyle = '#6b4423'; ctx.fillRect(-8, -6, 6, 6); ctx.fillRect(4, -6, 6, 6);
  ctx.fillStyle = '#e0b48a'; ctx.beginPath(); ctx.moveTo(2, -54); ctx.quadraticCurveTo(22, -52, 26, -44); ctx.quadraticCurveTo(14, -40, 2, -42); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#111'; circ(10, -49, 1.8); ctx.fill();
  limb(8, -32, 22 + Math.sin(t * 10) * 5, -56, 3, 4, '#6b4423');
  ctx.restore();
}

// Colugo ("flying lemur") seen from above, gliding membrane spread 0..1
function drawColugo(x, y, ang, sp) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  const L = lerp(14, 22, sp), Wd = lerp(9, 30, sp);
  ctx.fillStyle = '#8d8270';
  ctx.beginPath();
  ctx.moveTo(L * 0.8, 0);
  ctx.quadraticCurveTo(L * 0.95, -Wd * 0.5, L * 0.7, -Wd);
  ctx.quadraticCurveTo(0, -Wd * 0.7, -L * 0.9, -Wd * 0.9);
  ctx.quadraticCurveTo(-L * 1.3, -Wd * 0.45, -L * 1.6, 0);
  ctx.quadraticCurveTo(-L * 1.3, Wd * 0.45, -L * 0.9, Wd * 0.9);
  ctx.quadraticCurveTo(0, Wd * 0.7, L * 0.7, Wd);
  ctx.quadraticCurveTo(L * 0.95, Wd * 0.5, L * 0.8, 0);
  ctx.fill();
  ctx.fillStyle = 'rgba(240,235,215,0.55)';
  for (let i = 0; i < 6; i++) { circ(lerp(-L, L * 0.5, hash(i)), (hash(i + 9) - 0.5) * Wd * 1.3, 2.2); ctx.fill(); }
  ctx.fillStyle = '#5f5546'; ell(-L * 0.1, 0, L * 0.85, 6); ctx.fill();
  ctx.fillStyle = '#6f6555'; circ(L * 0.85, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; circ(L * 1.0, -3.5, 2.8); ctx.fill(); circ(L * 1.0, 3.5, 2.8); ctx.fill();
  ctx.fillStyle = '#111'; circ(L * 1.1, -3.5, 1.5); ctx.fill(); circ(L * 1.1, 3.5, 1.5); ctx.fill();
  ctx.restore();
}

// Rhinoceros hornbill in flight (faces right; flip=true faces left)
function drawHornbill(x, y, t, s = 1, flip = false) {
  ctx.save(); ctx.translate(x, y); ctx.scale(flip ? -s : s, s);
  const f = Math.sin(t * 9);
  ctx.fillStyle = '#2a241c'; ctx.beginPath(); ctx.moveTo(-4, -4); ctx.quadraticCurveTo(-10, -24 * f - 6, -22, -34 * f); ctx.lineTo(8, -4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#16130f'; ctx.beginPath(); ctx.moveTo(-12, -2); ctx.lineTo(-46, -6); ctx.lineTo(-46, 8); ctx.lineTo(-12, 5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f5f2ea'; ctx.fillRect(-41, -5, 9, 13);
  ctx.fillStyle = '#16130f'; ell(0, 1, 20, 10); ctx.fill(); circ(20, -4, 8); ctx.fill();
  ctx.fillStyle = '#f2c230'; ctx.beginPath(); ctx.moveTo(24, -8); ctx.quadraticCurveTo(44, -6, 54, 6); ctx.quadraticCurveTo(40, 2, 24, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e0541b'; ctx.beginPath(); ctx.moveTo(22, -10); ctx.quadraticCurveTo(36, -19, 47, -11); ctx.quadraticCurveTo(36, -10, 26, -6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; circ(21, -6, 2); ctx.fill();
  ctx.fillStyle = '#16130f'; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.quadraticCurveTo(-2, -28 * f, -16, -40 * f + 2); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill();
  ctx.restore();
}
// Perched hornbill judge (faces left), optional score card
function drawHornbillPerched(x, y, t, card, cardT = 1) {
  ctx.save(); ctx.translate(x, y);
  const bob = Math.sin(t * 2 + x) * 1.5;
  ctx.fillStyle = '#16130f'; ctx.beginPath(); ctx.moveTo(-2, -14); ctx.lineTo(10, 30); ctx.lineTo(22, 26); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f5f2ea'; ctx.beginPath(); ctx.moveTo(7, 18); ctx.lineTo(10, 30); ctx.lineTo(22, 26); ctx.lineTo(19, 15); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#16130f'; ell(4, -22 + bob, 13, 20, 0.2); ctx.fill();
  ctx.fillStyle = '#f3efe6'; ell(-2, -8 + bob, 7, 8); ctx.fill();
  ctx.fillStyle = '#16130f'; circ(-2, -46 + bob, 9); ctx.fill();
  ctx.fillStyle = '#f2c230'; ctx.beginPath(); ctx.moveTo(-8, -50 + bob); ctx.quadraticCurveTo(-28, -50 + bob, -38, -36 + bob); ctx.quadraticCurveTo(-24, -40 + bob, -8, -42 + bob); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e0541b'; ctx.beginPath(); ctx.moveTo(-6, -54 + bob); ctx.quadraticCurveTo(-20, -64 + bob, -32, -54 + bob); ctx.quadraticCurveTo(-20, -52 + bob, -8, -49 + bob); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; circ(-5, -48 + bob, 2); ctx.fill();
  ctx.strokeStyle = '#7a6a40'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(-2, 2); ctx.moveTo(6, -3); ctx.lineTo(6, 2); ctx.stroke();
  if (card != null) {
    const k = clamp(cardT, 0, 1), cy = lerp(-30, -96, k);
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(14, -20); ctx.lineTo(26, cy + 30); ctx.stroke();
    ctx.fillStyle = '#fffdf3'; rr(6, cy, 42, 32, 5); ctx.fill(); ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2; ctx.stroke();
    label(String(card), 27, cy + 17, 20, card >= 7 ? '#1d7a31' : card >= 4 ? '#8a5a00' : '#b0281c', 'center', '900');
  }
  ctx.restore();
}

// Proboscis monkey. rot 0 = upright, head up. tuck = curled into a ball.
function drawProboscis(x, y, rot, tuck, t, pose) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const fur = '#c8763a', belly = '#f1c48c', pale = '#ece4d2', nose = '#e9967a', face = '#eaa47e';
  if (tuck) {
    limb(-14, 10, -32, 26, 8, 5, pale);
    ctx.fillStyle = fur; circ(0, 0, 22); ctx.fill();
    ctx.fillStyle = belly; ell(8, 6, 12, 10); ctx.fill();
    ctx.fillStyle = pale; circ(14, 14, 7); ctx.fill(); circ(4, 18, 6); ctx.fill();
    ctx.fillStyle = fur; circ(10, -15, 12); ctx.fill();
    ctx.fillStyle = face; ell(15, -13, 7, 8); ctx.fill();
    ctx.fillStyle = nose; ell(22, -7, 5, 7, 0.4); ctx.fill();
    ctx.strokeStyle = '#3a2216'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(12, -17); ctx.lineTo(16, -16); ctx.stroke();
  } else {
    const run = pose === 'run', sw = run ? Math.sin(t * 18) * 10 : 0;
    limb(-6, 18, -8 - sw, 38, 3, 8, pale); limb(6, 18, 8 + sw, 38, -3, 8, pale);
    limb(-12, 14, -32, 30, -10, 5, pale);
    ctx.fillStyle = fur; ell(0, -2, 16, 24); ctx.fill();
    ctx.fillStyle = belly; ell(9, 6, 11, 14); ctx.fill();
    const ar = run ? [18, 2 + sw * 0.4] : pose === 'flail' ? [24, -30 + Math.sin(t * 25) * 10] : [8, -48];
    limb(-6, -16, ar[0] - 10, ar[1], 4, 7, pale); limb(8, -16, ar[0], ar[1], 4, 7, pale);
    ctx.fillStyle = fur; circ(2, -30, 12); ctx.fill();
    ctx.fillStyle = face; ell(7, -29, 8, 8); ctx.fill();
    ctx.fillStyle = '#1b0f08'; circ(7, -32, 1.8); ctx.fill(); circ(12, -32, 1.8); ctx.fill();
    ctx.fillStyle = nose; ell(15, -22, 5, 8, 0.25); ctx.fill();
  }
  ctx.restore();
}

// Rajah Brooke's birdwing butterfly (Sarawak icon)
function drawButterfly(x, y, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(0.25 + 0.75 * Math.abs(Math.sin(t)), 1);
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(s * 13, -9); ctx.lineTo(s * 11, 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2ee86a'; ctx.beginPath(); ctx.moveTo(s * 3, -2); ctx.lineTo(s * 11, -7); ctx.lineTo(s * 9, 1); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#c0392b'; ctx.fillRect(-1, -5, 2, 10);
  ctx.restore();
}

// ============================================================
//  SCENERY
// ============================================================
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#78cfc3'); g.addColorStop(0.7, '#d8f0c0'); g.addColorStop(1, '#eef7cf');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,252,215,0.55)'; circ(790, 95, 52); ctx.fill();
}
function drawHills(cam, f, col, base, amp, seed) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
  const off = cam * f;
  for (let sx = 0; sx <= W + 20; sx += 20) {
    const wx = sx + off;
    ctx.lineTo(sx, base - amp * (0.5 + 0.5 * Math.sin(wx * 0.004 + seed)) - amp * 0.4 * Math.sin(wx * 0.011 + seed * 2));
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function drawTrees(cam, f, spacing, seed, gy, k, trunk, leaf) {
  const off = cam * f, i0 = Math.floor(off / spacing) - 1, i1 = Math.floor((off + W) / spacing) + 1;
  for (let i = i0; i <= i1; i++) {
    const h = hash(i * 7.3 + seed), x = i * spacing - off + h * spacing * 0.6, th = (130 + h * 130) * k;
    ctx.fillStyle = trunk; ctx.fillRect(x - 6 * k, gy - th, 12 * k, th);
    ctx.fillStyle = leaf;
    for (let j = 0; j < 4; j++) { const hj = hash(i * 13.1 + j + seed); circ(x + (hj - 0.5) * 64 * k, gy - th - hash(i + j * 3.7 + seed) * 30 * k, (28 + hj * 22) * k); ctx.fill(); }
  }
}
function drawGround(cam, gy = GY) {
  ctx.fillStyle = '#4a8a34'; ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = '#3a7228'; ctx.fillRect(0, gy, W, 5);
  const sp = 38, i0 = Math.floor(cam / sp) - 1, i1 = Math.floor((cam + W) / sp) + 1;
  ctx.fillStyle = '#62a845';
  for (let i = i0; i <= i1; i++) {
    const h = hash(i * 3.1), x = i * sp - cam + h * 20;
    ctx.beginPath(); ctx.moveTo(x - 7, gy + 2); ctx.lineTo(x - 3, gy - 8 - h * 9); ctx.lineTo(x, gy + 2); ctx.lineTo(x + 4, gy - 6 - h * 7); ctx.lineTo(x + 8, gy + 2); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#6b4a2e'; ctx.fillRect(0, gy + 36, W, H - gy - 36);
}
function drawClouds(cam, camY) {
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  const sp = 330, off = cam * 0.25, i0 = Math.floor(off / sp) - 1, i1 = Math.floor((off + W) / sp) + 1;
  for (let i = i0; i <= i1; i++) {
    for (let lay = 0; lay < 3; lay++) {
      const x = i * sp - off + hash(i * 4.7 + lay) * 150, y = 40 + hash(i * 9.1 + lay) * 160 - lay * 300 - camY * 0.6;
      if (y < -60 || y > H + 60) continue;
      ell(x, y, 46, 16); ctx.fill(); ell(x + 26, y - 10, 28, 16); ctx.fill(); ell(x - 24, y - 6, 24, 12); ctx.fill();
    }
  }
}
function drawJungle(cam, camY = 0) {
  drawSky();
  drawClouds(cam, camY);
  ctx.save(); ctx.translate(0, -camY);
  drawHills(cam, 0.08, '#9ccfae', 300, 60, 1);
  drawHills(cam, 0.18, '#74b08a', 352, 70, 4);
  drawTrees(cam, 0.35, 140, 11, GY - 20, 0.8, '#4f6e48', '#558f58');
  drawTrees(cam, 0.6, 220, 23, GY, 1.1, '#5a3f2a', '#3d7f3f');
  drawGround(cam);
  ctx.restore();
}
// Distance signposts — call inside the world transform
function drawMarkers(origin, cam, every = 250) {
  const i0 = Math.max(1, Math.floor((cam - origin) / every)), i1 = Math.floor((cam + W - origin) / every) + 1;
  for (let i = i0; i <= i1; i++) {
    const x = origin + i * every;
    ctx.fillStyle = '#7a5230'; ctx.fillRect(x - 3, GY - 34, 6, 34);
    ctx.fillStyle = '#efdca6'; rr(x - 26, GY - 54, 52, 22, 5); ctx.fill();
    label(i * every / 10 + ' m', x, GY - 43, 13, '#4a3015', 'center', '800');
  }
}
function drawBigTree(x, w, top = -20) {
  ctx.fillStyle = '#5b3c26'; ctx.fillRect(x, top, w, GY - top + 4);
  ctx.strokeStyle = '#4a301e'; ctx.lineWidth = 3;
  for (let i = 0; i < 9; i++) { const y = top + 40 + i * 55; ctx.beginPath(); ctx.moveTo(x + 10 + (i % 3) * 12, y); ctx.lineTo(x + 18 + (i % 3) * 12, y + 30); ctx.stroke(); }
  // buttress roots
  ctx.fillStyle = '#5b3c26'; ctx.beginPath(); ctx.moveTo(x - 26, GY + 4); ctx.quadraticCurveTo(x, GY - 20, x, GY - 70); ctx.lineTo(x + w, GY - 70); ctx.quadraticCurveTo(x + w, GY - 20, x + w + 26, GY + 4); ctx.closePath(); ctx.fill();
}
function drawBranch(x0, y0, x1, y1, w) {
  ctx.strokeStyle = '#5b3c26'; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  leaves(x1, y1 - 6, 7, x1);
}
function leaves(x, y, n, seed) {
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = i % 2 ? '#3f8a3e' : '#56a84a';
    ell(x + (hash(seed + i) - 0.5) * 60, y + (hash(seed + i * 2.3) - 0.5) * 26, 16, 7, hash(seed + i * 5) * Math.PI); ctx.fill();
  }
}

// ============================================================
//  RESULT PANEL (shared)

function resultPanel(lines, newBest, endT, hint) {
  const k = clamp(endT * 3, 0, 1), y = lerp(H, 140, 1 - Math.pow(1 - k, 3));

// ============================================================
//  GAME 1 — PANGOLIN FLING
//  Oren swings on a vine holding a curled-up pangolin.
//  HOLD to pump the swing higher, RELEASE to let go. Timing = angle.
// ============================================================
const fling = {
  id: 'fling',
  enter() {
    Object.assign(this, { state: 'swing', t: 0, A: 0.3, phase: 0, w: 2.6, holding: false, cam: 0, camY: 0, piv: [230, 34], L: 200,
      b: null, endT: 0, parts: new Parts(), msgs: [], best: store.get('fling', 0), newBest: false, dist: 0 });
    this.birds = []; let x = 900;
    for (let i = 0; i < 90; i++) { this.birds.push({ x, y: -260 + Math.random() * 520, used: false, t: Math.random() * 6 }); x += 240 + Math.random() * 360; }
  },
  theta(p = this.phase) { return this.A * Math.sin(p); },
  grip(p = this.phase) { const th = this.theta(p); return [this.piv[0] + this.L * Math.sin(th), this.piv[1] + this.L * Math.cos(th), th]; },
  ballPos(p = this.phase) {   // pangolin held in Oren's free hand, local offset (58,100) in vine frame
    const [gx, gy, th] = this.grip(p), c = Math.cos(-th), s = Math.sin(-th), lx = 58, ly = 100;
    return [gx + lx * c - ly * s, gy + lx * s + ly * c];
  },
  down() {
    if (this.state === 'swing') { this.holding = true; sfx(300, 0.08, 'triangle', 0.08); }
    else if (this.state === 'done' && this.endT > 0.6) this.enter();
  },
  up() { if (this.state === 'swing' && this.holding) this.release(); this.holding = false; },
  release() {
    const e = 0.002, p0 = this.ballPos(), p1 = this.ballPos(this.phase + e), dtp = e / this.w, k = 0.95;
    this.b = { x: p0[0], y: p0[1], vx: (p1[0] - p0[0]) / dtp * k, vy: (p1[1] - p0[1]) / dtp * k, rot: 0, r: 15 };
    this.state = 'fly'; this.t = 0;
    sfx(380, 0.3, 'triangle', 0.15, 500);
    pushMsg(this, this.b.vx < 0 ? 'Wrong way!' : 'Wheee!');
  },
  finish() {
    this.state = 'done'; this.endT = 0;
    this.dist = Math.max(0, (this.b.x - this.piv[0]) / 10);
    if (this.dist > this.best) { this.best = this.dist; store.set('fling', this.best); this.newBest = true; fanfare(); } else sfx(520, 0.2, 'triangle', 0.12);
  },
  step(h) {
    const b = this.b;
    b.vy += 650 * h; b.x += b.vx * h; b.y += b.vy * h; b.rot += b.vx * h / b.r;
    if (b.x < 110) { b.x = 110; b.vx = Math.abs(b.vx) * 0.5; }
    if (b.y > GY - b.r) {
      b.y = GY - b.r;
      if (b.vy > 90) {
        if (b.vy > 250) { sfx(110, 0.12, 'square', 0.07); this.parts.add(b.x, GY, 8, { col: '#a07a4a', sp: 120, life: 0.5, r: 4 }); }
        b.vy = -b.vy * 0.42; b.vx *= 0.8;
      } else {
        b.vy = 0; const f = 300 * h;
        if (Math.abs(b.vx) <= f) { b.vx = 0; this.finish(); return; }
        b.vx -= Math.sign(b.vx) * f;
      }
    }
    for (const hb of this.birds) {
      if (hb.used || Math.abs(b.x - hb.x) > 70) continue;
      if (Math.hypot(b.x - hb.x, b.y - (hb.y + Math.sin(hb.t * 2) * 8)) < 62) {
        hb.used = true;
        b.vx = Math.max(b.vx, 0) * 0.9 + 220; b.vy = -Math.max(420, Math.abs(b.vy) * 0.7);
        sfx(600, 0.25, 'triangle', 0.15, 600);
        this.parts.add(b.x, b.y, 16, { col: '#ffd23f', sp: 220, life: 0.6, r: 3, g: 200, spread: TAU });
        pushMsg(this, 'Hornbill boost!');
      }
    }
  },
  update(dt) {
    this.t += dt; this.phase += this.w * dt;
    if (this.state === 'swing') this.A = this.holding ? Math.min(1.3, this.A + 0.6 * dt) : Math.max(0.3, this.A - 0.12 * dt);
    else this.A = Math.max(0.3, this.A - 0.2 * dt);
    for (const h of this.birds) { h.t += dt; if (h.used) { h.y -= 140 * dt; h.x += 90 * dt; } }
    if (this.state === 'fly') {
      for (let i = 0; i < 4 && this.state === 'fly'; i++) this.step(dt / 4);
      this.dist = Math.max(0, (this.b.x - this.piv[0]) / 10);
    }
    if (this.b) {
      this.cam = lerp(this.cam, Math.max(0, this.b.x - 320), 1 - Math.exp(-8 * dt));
      this.camY = lerp(this.camY, Math.min(0, this.b.y - 150), 1 - Math.exp(-6 * dt));
    }
    if (this.state === 'done') this.endT += dt;
    this.parts.update(dt); updMsgs(this, dt);
  },
  drawSwinger() {
    const [gx, gy, th] = this.grip();
    ctx.strokeStyle = '#3f6b2a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(this.piv[0], this.piv[1]); ctx.quadraticCurveTo((this.piv[0] + gx) / 2 + th * 10, (this.piv[1] + gy) / 2, gx, gy); ctx.stroke();
    ctx.save(); ctx.translate(gx, gy); ctx.rotate(-th);
    const holdingBall = this.state === 'swing';
    drawOrangutan(16, 78, { lh: [-16, -78], rh: holdingBall ? [36, 16] : [34, -26 + Math.sin(this.t * 12) * 6],
      lf: [-20, 50], rf: [20, 50], mood: holdingBall ? (this.holding ? 'oh' : 'flat') : 'happy', look: holdingBall ? 1.5 : 2 });
    if (holdingBall) drawPangolinBall(58, 100, 15, 0);
    ctx.restore();
  },
  draw() {
    const cam = this.cam, camY = this.camY;
    drawJungle(cam, camY);
    ctx.save(); ctx.translate(-cam, -camY);
    drawMarkers(this.piv[0], cam);
    if (cam < 500) {
      drawBigTree(20, 70);
      drawBranch(60, 34, this.piv[0] + 40, 26, 16);
      this.drawSwinger();
    }
    for (const h of this.birds) {
      if (h.x - cam < -80 || h.x - cam > W + 80 || h.y - camY < -80 || h.y - camY > H + 80) continue;
      drawHornbill(h.x, h.y + (h.used ? 0 : Math.sin(h.t * 2) * 8), h.t, 0.9, !h.used);
    }
    if (this.b) {
      if (this.state === 'done') drawPangolinStand(this.b.x, GY, this.t);
      else drawPangolinBall(this.b.x, this.b.y, this.b.r, this.b.rot);
    }
    this.parts.draw();
    ctx.restore();

    // HUD
    if (this.state === 'fly' && this.b.y < 0) label('height ' + ((GY - this.b.y) / 10).toFixed(0) + ' m', W / 2, 62, 14, '#20391f');
    text(this.dist.toFixed(1) + ' m', W / 2, 32, 30, '#fff');
    label('Best ' + this.best.toFixed(1) + ' m', W - 64, 30, 15, '#fff', 'right');
    if (this.state === 'swing') {
      ctx.fillStyle = 'rgba(16,44,26,0.75)'; rr(400, 64, 200, 16, 8); ctx.fill();
      ctx.fillStyle = this.A > 1.2 ? '#7dff8a' : '#ffd45c'; rr(402, 66, 196 * clamp((this.A - 0.3) / 1.0, 0, 1), 12, 6); ctx.fill();
      label('swing power', W / 2, 92, 12, '#20391f');
      hintBar(this.holding ? 'Now RELEASE when the swing points up and forward!' : 'HOLD (mouse / touch / Space) to swing higher');
    }
    drawMsgs(this);
    if (this.state === 'done') resultPanel(['The pangolin rolled', this.dist.toFixed(1) + ' m', 'Best: ' + this.best.toFixed(1) + ' m'], this.newBest, this.endT, 'Tap to fling again');
  }
};

// ============================================================
//  GAME 2 — COLUGO GLIDE
//  Oren tosses a colugo off a tall tree. HOLD to spread and glide,
//  RELEASE to tuck and dive for speed. Butterfly updrafts lift you.
// ============================================================
const glide = {
  id: 'glide',
  enter() {
    Object.assign(this, { state: 'aim', t: 0, pow: 0, pd: 1, cam: 0, camY: 0, c: null, holding: false, endT: 0, parts: new Parts(), msgs: [],
      best: store.get('glide', 0), newBest: false, throwT: -1, flyT: 0, ox: 150, top: 170, dist: 0 });
    this.drafts = []; let x = 1000;
    for (let i = 0; i < 90; i++) { this.drafts.push({ x, w: 120, t: Math.random() * 10, hit: false }); x += 700 + Math.random() * 900; }
  },
  down() {
    if (this.state === 'aim') this.launch();
    else if (this.state === 'fly') this.holding = true;
    else if (this.state === 'done' && this.endT > 0.6) this.enter();
  },
  up() { this.holding = false; },
  launch() {
    const sp = 220 + 480 * this.pow, a = -0.45;
    this.c = { x: this.ox + 22, y: this.top - 128, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, spread: 0.3 };
    this.state = 'fly'; this.holding = true; this.throwT = 0;
    sfx(300, 0.3, 'triangle', 0.15, 400);
  },
  finish() {
    this.state = 'done'; this.endT = 0;
    this.dist = Math.max(0, (this.c.x - this.ox) / 10);
    if (this.dist > this.best) { this.best = this.dist; store.set('glide', this.best); this.newBest = true; fanfare(); } else sfx(520, 0.2, 'triangle', 0.12);
  },
  step(h) {
    const c = this.c;
    if (this.state === 'slide') {
      c.spread = lerp(c.spread, 1, Math.min(1, 6 * h));
      c.vx -= 520 * h; if (c.vx <= 0) { c.vx = 0; this.finish(); return; }
      c.x += c.vx * h; return;
    }
    c.spread += ((this.holding ? 1 : 0) - c.spread) * Math.min(1, 10 * h);
    // simple wing: lift is perpendicular to velocity, drag opposes it
    const s = Math.hypot(c.vx, c.vy) || 1, cl = lerp(0.00012, 0.0021, c.spread), cd = lerp(0.0001, 0.00055, c.spread);
    const ax = -cd * s * c.vx + cl * s * c.vy;
    let ay = 420 - cd * s * c.vy - cl * s * c.vx;
    for (const d of this.drafts) {
      if (Math.abs(c.x - d.x) < d.w / 2 && c.y > 70) {
        ay -= 2200 * (0.3 + 0.7 * c.spread);
        if (!d.hit) { d.hit = true; sfx(700, 0.3, 'sine', 0.12, 500); pushMsg(this, 'Butterfly updraft!', '#9dffb8'); }
      }
    }
    c.vx += ax * h; c.vy += ay * h; c.x += c.vx * h; c.y += c.vy * h;
    if (c.x < this.ox + 40 && c.vx < 0) c.vx = 0;
    if (c.y > GY - 12) {
      c.y = GY - 12; c.vy = 0; c.vx = Math.max(0, c.vx) * 0.6; this.state = 'slide';
      sfx(140, 0.15, 'square', 0.06); this.parts.add(c.x, GY, 10, { col: '#a07a4a', sp: 140, life: 0.5, r: 4 });
    }
  },
  update(dt) {
    this.t += dt; if (this.throwT >= 0) this.throwT += dt;
    if (this.state === 'aim') {
      this.pow += this.pd * dt * 1.3;
      if (this.pow > 1) { this.pow = 1; this.pd = -1; } if (this.pow < 0) { this.pow = 0; this.pd = 1; }
    }
    if (this.state === 'fly' || this.state === 'slide') {
      for (let i = 0; i < 4 && this.state !== 'done'; i++) this.step(dt / 4);
      this.flyT += dt; this.dist = Math.max(0, (this.c.x - this.ox) / 10);
    }
    if (this.c) {
      this.cam = lerp(this.cam, Math.max(0, this.c.x - 300), 1 - Math.exp(-6 * dt));
      this.camY = lerp(this.camY, Math.min(0, this.c.y - 150), 1 - Math.exp(-5 * dt));
    }
    if (this.state === 'done') this.endT += dt;
    for (const d of this.drafts) d.t += dt;
    this.parts.update(dt); updMsgs(this, dt);
  },
  draw() {
    const cam = this.cam, camY = this.camY;
    drawJungle(cam, camY);
    ctx.save(); ctx.translate(-cam, -camY);
    drawMarkers(this.ox, cam);
    for (const d of this.drafts) {
      if (d.x - cam < -100 || d.x - cam > W + 100) continue;
      const g = ctx.createLinearGradient(0, 70, 0, GY);
      g.addColorStop(0, 'rgba(255,255,210,0)'); g.addColorStop(1, 'rgba(255,255,210,0.32)');
      ctx.fillStyle = g; ctx.fillRect(d.x - d.w / 2, 70, d.w, GY - 70);
      for (let k = 0; k < 6; k++) drawButterfly(d.x + Math.sin(d.t * 2 + k) * d.w * 0.35, GY - 10 - ((d.t * 70 + k * 70) % (GY - 90)), d.t * 12 + k);
    }
    if (cam < 600) {
      drawBigTree(60, 80, -20);
      drawBranch(100, this.top + 8, this.ox + 70, this.top + 4, 18);
      const thrown = this.throwT >= 0, tw = thrown ? clamp(this.throwT * 4, 0, 1) : 0;
      drawOrangutan(this.ox, this.top - 56, {
        lh: [-30, 18], rh: thrown ? [lerp(18, 44, tw), lerp(-62, -20, tw)] : [18, -62],
        mood: this.state === 'aim' ? 'flat' : this.state === 'done' ? 'happy' : 'oh', look: 2 });
      if (!thrown) drawColugo(this.ox + 20, this.top - 128, -Math.PI / 2, 0.2);
    }
    if (this.c) {
      const c = this.c, ang = this.state === 'fly' ? Math.atan2(c.vy, c.vx) : 0;
      drawColugo(c.x, c.y, ang, c.spread);
    }
    this.parts.draw();
    ctx.restore();

    text(this.dist.toFixed(1) + ' m', W / 2, 32, 30, '#fff');
    label('Best ' + this.best.toFixed(1) + ' m', W - 64, 30, 15, '#fff', 'right');
    if (this.state === 'aim') {
      ctx.fillStyle = 'rgba(16,44,26,0.75)'; rr(400, 64, 200, 16, 8); ctx.fill();
      ctx.fillStyle = this.pow > 0.85 ? '#7dff8a' : '#ffd45c'; rr(402, 66, 196 * this.pow, 12, 6); ctx.fill();
      label('throw power', W / 2, 92, 12, '#20391f');
      hintBar('TAP when the power bar is full to toss the colugo');
    } else if (this.state === 'fly' && this.flyT < 4) {
      hintBar('HOLD = spread & glide   ·   LET GO = tuck & dive for speed');
    }
    drawMsgs(this);
    if (this.state === 'done') resultPanel(['The colugo glided', this.dist.toFixed(1) + ' m', 'Best: ' + this.best.toFixed(1) + ' m'], this.newBest, this.endT, 'Tap to glide again');
  }
};

// ============================================================
//  GAME 3 — PROBOSCIS PLUNGE
//  A proboscis monkey runs along a branch and dives into the river
//  (they really do leap into rivers!). TAP to jump — later is higher.
//  Keep HOLDING to tuck & spin, LET GO to straighten for a clean entry.
//  Three hornbill judges score each of 3 dives.
// ============================================================
const BR_Y = 200, EDGE = 420, WY = 440;
const plunge = {
  id: 'plunge',
  enter() { Object.assign(this, { round: 0, scores: [], best: store.get('plunge', 0), newBest: false, parts: new Parts(), msgs: [], t: 0 }); this.newRound(); },
  newRound() { Object.assign(this, { state: 'run', m: { x: 80, y: BR_Y - 38, vx: 0, vy: 0, rot: 0, av: 0 }, tuck: false, holding: false, closeness: 0, slipped: false, stT: 0, res: null, shown: 0 }); },
  down() {
    if (this.state === 'run') this.jump();
    else if (this.state === 'air') this.holding = true;
    else if (this.state === 'judge' && this.stT > 1.6) {
      if (this.round >= 3) {
        this.state = 'final'; this.stT = 0;
        const tot = this.scores.reduce((a, b) => a + b, 0);
        if (tot > this.best) { this.best = tot; store.set('plunge', tot); this.newBest = true; fanfare(); }
      } else this.newRound();
    } else if (this.state === 'final' && this.stT > 0.6) this.enter();
  },
  up() { this.holding = false; },
  jump() {
    const m = this.m;
    this.closeness = clamp(1 - (EDGE - m.x) / 260, 0, 1);
    m.vy = -(280 + 240 * this.closeness); m.vx *= 0.35; m.av = 2 + this.closeness;
    this.state = 'air'; this.holding = true; this.stT = 0;
    sfx(420, 0.2, 'triangle', 0.14, 300);
    if (this.closeness > 0.9) pushMsg(this, 'Great take-off!');
  },
  enterWater() {
    const m = this.m, e = ((m.rot % TAU) + TAU) % TAU, q = Math.abs(Math.cos(e)), half = Math.max(0, Math.round(m.rot / Math.PI)), tucked = this.tuck;
    let lbl;
    if (tucked) lbl = 'CANNONBALL!'; else if (q > 0.93) lbl = 'PERFECT ENTRY!'; else if (q > 0.7) lbl = 'Clean dive'; else if (q > 0.4) lbl = 'Bit splashy...'; else lbl = 'BELLY FLOP!';
    const base = 1.5 + 5 * (tucked ? Math.min(q, 0.4) : q) + Math.min(3, half * 0.5) + this.closeness * 0.8 - (this.slipped ? 2 : 0);
    const cards = [0, 1, 2].map(() => clamp(Math.round((base + (Math.random() - 0.5) * 1.4) * 2) / 2, 0, 10));
    const big = tucked ? 1.6 : 1.3 - q;
    this.parts.add(m.x, WY, Math.round(20 + 40 * big), { col: '#e8fbff', sp: 250 + 320 * big, life: 1.0, r: 4, spread: 1.2, g: 700 });
    noise(0.5 + big * 0.3, 0.25, 1400);
    this.res = { cards, lbl, turns: half / 2, total: cards.reduce((a, b) => a + b, 0) };
    this.scores.push(this.res.total); this.round++;
    this.state = 'splash'; this.stT = 0; this.shown = 0;
  },
  update(dt) {
    this.t += dt; this.stT += dt;
    const m = this.m;
    if (this.state === 'run') {
      m.vx = Math.min(340, m.vx + 300 * dt); m.x += m.vx * dt;
      if (m.x > EDGE + 6) { this.state = 'air'; this.slipped = true; m.vy = 20; m.vx *= 0.5; m.av = 3; this.stT = 0; pushMsg(this, 'Whoops — too late!'); sfx(200, 0.3, 'sawtooth', 0.06, -120); }
    } else if (this.state === 'air') {
      const tgt = this.holding ? 11 : 1;
      m.av += (tgt - m.av) * Math.min(1, 12 * dt); m.rot += m.av * dt;
      m.vy += 1050 * dt; m.x += m.vx * dt; m.y += m.vy * dt;
      this.tuck = this.holding;
      if (m.y > WY - 6) this.enterWater();
    } else if (this.state === 'splash') {
      if (this.stT > 1.1) { this.state = 'judge'; this.stT = 0; }
    } else if (this.state === 'judge') {
      const n = Math.min(3, Math.floor((this.stT - 0.2) / 0.35) + 1);
      if (n > this.shown && this.stT > 0.2) { this.shown = n; sfx(880 + n * 110, 0.12, 'triangle', 0.12); }
    }
    this.parts.update(dt); updMsgs(this, dt);
  },
  draw() {
    drawSky();
    drawHills(0, 0, '#9ccfae', 300, 60, 1);
    drawHills(0, 0, '#74b08a', 362, 60, 4);
    drawTrees(0, 0, 150, 31, WY - 6, 0.85, '#4f6e48', '#558f58');
    // river
    const g = ctx.createLinearGradient(0, WY, 0, H); g.addColorStop(0, '#5a8f7a'); g.addColorStop(1, '#2f5e55');
    ctx.fillStyle = g; ctx.fillRect(0, WY, W, H - WY);
    ctx.strokeStyle = 'rgba(230,255,245,0.35)'; ctx.lineWidth = 2;
    for (let i = 0; i < 9; i++) { const y = WY + 12 + i * 11, o = (this.t * 30 * (i % 2 ? 1 : -1) + i * 70) % 120; ctx.beginPath(); for (let x = -120 + o; x < W; x += 120) { ctx.moveTo(x, y); ctx.lineTo(x + 40, y); } ctx.stroke(); }
    // left bank
    ctx.fillStyle = '#4a8a34'; ctx.beginPath(); ctx.moveTo(0, WY - 44); ctx.lineTo(230, WY - 36); ctx.quadraticCurveTo(270, WY - 20, 290, WY + 8); ctx.lineTo(290, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6b4a2e'; ctx.beginPath(); ctx.moveTo(0, WY - 6); ctx.lineTo(260, WY - 4); ctx.lineTo(292, WY + 10); ctx.lineTo(292, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    // tree and diving branch
    ctx.fillStyle = '#5b3c26'; ctx.fillRect(28, -10, 64, WY - 30);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#5b3c26'; ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(60, BR_Y + 9); ctx.lineTo(EDGE, BR_Y + 7); ctx.stroke();
    leaves(EDGE + 10, BR_Y - 2, 6, 7); leaves(70, 30, 8, 3);
    // judges branch
    ctx.strokeStyle = '#5b3c26'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(W + 10, 158); ctx.lineTo(708, 164); ctx.stroke();
    leaves(712, 156, 5, 21);
    const judging = this.state === 'judge' && this.res;
    [764, 834, 904].forEach((x, i) => drawHornbillPerched(x, 154, this.t, judging && this.shown > i ? this.res.cards[i] : null, judging ? (this.stT - 0.2 - i * 0.35) * 5 : 0));
    // Oren the coach on the riverbank
    const cheer = (this.state === 'judge' && this.res && this.res.total >= 21) || this.state === 'final';
    drawOrangutan(160, WY - 92, { lh: cheer ? [-30, -40 + Math.sin(this.t * 10) * 5] : [-28, 24], rh: cheer ? [30, -42 - Math.sin(this.t * 10) * 5] : [30, 10],
      lf: [-24, 46], rf: [24, 46], mood: this.state === 'air' ? 'oh' : cheer ? 'happy' : 'flat', look: 2, s: 0.85 });
    // monkey
    const m = this.m;
    if (this.state === 'run' || this.state === 'air') {
      drawProboscis(m.x, m.y, m.rot, this.state === 'air' && this.tuck, this.t, this.state === 'run' ? 'run' : this.slipped ? 'flail' : 'dive');
    } else if (this.stT > 0.6 || this.state !== 'splash') {
      const bob = Math.sin(this.t * 4) * 3, x = m.x + 10;
      ctx.fillStyle = '#c8763a'; circ(x, WY - 4 + bob, 12); ctx.fill();
      ctx.fillStyle = '#eaa47e'; ell(x + 5, WY - 3 + bob, 8, 8); ctx.fill();
      ctx.fillStyle = '#e9967a'; ell(x + 13, WY + 4 + bob, 5, 8, 0.25); ctx.fill();
      ctx.fillStyle = '#1b0f08'; circ(x + 5, WY - 6 + bob, 1.8); ctx.fill(); circ(x + 10, WY - 6 + bob, 1.8); ctx.fill();
      ctx.strokeStyle = 'rgba(230,255,245,0.6)'; ctx.lineWidth = 2; ell(x, WY + 6, 26, 5); ctx.stroke();
    }
    this.parts.draw();

    // HUD
    const tot = this.scores.reduce((a, b) => a + b, 0);
    text('Dive ' + Math.min(3, this.round + (this.state === 'run' || this.state === 'air' ? 1 : 0)) + ' / 3', 260, 32, 24, '#fff');
    text('Total ' + tot.toFixed(1), W / 2 + 60, 32, 24, '#ffd45c');
    label('Best ' + this.best.toFixed(1), W - 64, 30, 15, '#fff', 'right');
    if (this.state === 'run') hintBar(this.round === 0 ? 'TAP to jump — the closer to the end of the branch, the higher' : 'TAP to jump!');
    if (this.state === 'air') hintBar(this.holding ? 'Tucked & spinning — LET GO to straighten out!' : 'HOLD to tuck & spin');
    drawMsgs(this);
    if (this.state === 'judge' && this.res) {
      panel(W / 2 - 200, 200, 400, 150);
      text(this.res.lbl, W / 2, 238, 30, this.res.lbl === 'BELLY FLOP!' ? '#ff9d8a' : '#7dff8a');
      label(this.res.turns + ' somersault' + (this.res.turns === 1 ? '' : 's') + '   ·   judges: ' + (this.shown >= 3 ? this.res.total.toFixed(1) : '...'), W / 2, 282, 18, '#fff');
      if (this.stT > 1.6) label(this.round >= 3 ? 'Tap for final score' : 'Tap for next dive', W / 2, 322, 16, `rgba(255,255,255,${0.6 + 0.4 * Math.sin(this.stT * 5)})`);
    }
    if (this.state === 'final') resultPanel(['Three-dive total', tot.toFixed(1) + ' / 90', 'Best: ' + this.best.toFixed(1)], this.newBest, this.stT, 'Tap to dive again');
  }
};

// ============================================================
//  MENU
// ============================================================
const SCENES = { fling, glide, plunge };
const GAMES = [
  { id: 'fling', name: 'Pangolin Fling', desc: ['Hold to swing higher,', 'release to let go.'], unit: ' m' },
  { id: 'glide', name: 'Colugo Glide', desc: ['Hold to glide,', 'let go to dive.'], unit: ' m' },
  { id: 'plunge', name: 'Proboscis Plunge', desc: ['Tap to jump, hold to tuck,', 'let go for a clean entry.'], unit: ' pts' }
];
const menu = {
  enter() { this.t = 0; this.cam = 0; },
  cards() { return GAMES.map((g, i) => ({ g, x: 60 + i * 290, y: 160, w: 260, h: 290 })); },
  down(x, y) { for (const c of this.cards()) if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) { sfx(660, 0.1, 'triangle'); go(SCENES[c.g.id]); return; } },
  up() {},
  update(dt) { this.t += dt; this.cam += 25 * dt; },
  preview(id, x, y, w, h) {
    ctx.save(); rr(x, y, w, h, 10); ctx.clip();
    const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#8fdcc9'); g.addColorStop(1, '#e2f4c6'); ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    const t = this.t;
    if (id === 'fling') {
      ctx.fillStyle = '#4a8a34'; ctx.fillRect(x, y + h - 18, w, 18);
      const th = 0.8 * Math.sin(t * 2.4), px = x + 80, py = y - 4, L = 70, gx = px + L * Math.sin(th), gy = py + L * Math.cos(th);
      ctx.strokeStyle = '#3f6b2a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(gx, gy); ctx.stroke();
      ctx.save(); ctx.translate(gx, gy); ctx.rotate(-th); ctx.scale(0.55, 0.55);
      drawOrangutan(16, 78, { lh: [-16, -78], rh: [36, 16], lf: [-20, 50], rf: [20, 50], look: 1.5 }); drawPangolinBall(58, 100, 15, 0); ctx.restore();
      const bx = x + 150 + ((t * 60) % 90), by = y + 40 + Math.pow(((t * 60) % 90) / 45 - 1, 2) * 50;
      drawPangolinBall(bx, by, 9, t * 8);
      drawHornbill(x + 200, y + 34 + Math.sin(t * 2) * 4, t, 0.5, true);
    } else if (id === 'glide') {
      for (let k = 0; k < 4; k++) drawButterfly(x + 40 + k * 55, y + 110 - ((t * 40 + k * 30) % 90), t * 12 + k);
      drawColugo(x + w / 2 + Math.sin(t * 1.3) * 30, y + h / 2 - 10 + Math.sin(t * 2) * 10, 0.15 * Math.sin(t * 2), 1);
    } else {
      ctx.fillStyle = '#4f8b78'; ctx.fillRect(x, y + h - 30, w, 30);
      const k = (t * 0.7) % 1;
      drawProboscis(x + 80 + k * 90, y + 20 + k * 90 - Math.sin(k * Math.PI) * 50, k * TAU * 1.5, k < 0.7, t, 'dive');
      drawHornbillPerched(x + w - 30, y + 118, t, 9.5, 1);
    }
    ctx.restore();
  },
  draw() {
    drawJungle(this.cam);
    ctx.fillStyle = 'rgba(10,30,18,0.3)'; ctx.fillRect(0, 0, W, H);
    drawHornbill(((this.t * 70) % 1200) - 120, 40 + Math.sin(this.t) * 10, this.t, 0.7);
    drawOrangutan(120, 92, { lh: [-30, 20], rh: [34, -40 + Math.sin(this.t * 8) * 8], mood: 'happy', s: 0.8 });
    text('RIMBA GAMES', W / 2, 62, 54, '#ffd45c');
    text('Starring Oren the Orangutan  ·  Sarawak, Borneo', W / 2, 110, 17, '#f2ffe8', 'center', '600');
    for (const c of this.cards()) {
      panel(c.x, c.y, c.w, c.h);
      this.preview(c.g.id, c.x + 10, c.y + 10, c.w - 20, 140);
      text(c.g.name, c.x + c.w / 2, c.y + 176, 22, '#fff');
      label(c.g.desc[0], c.x + c.w / 2, c.y + 206, 14, '#d8f5d0', 'center', '600');
      label(c.g.desc[1], c.x + c.w / 2, c.y + 225, 14, '#d8f5d0', 'center', '600');
      const b = store.get(c.g.id, 0);
      label(b ? 'Best: ' + b.toFixed(1) + c.g.unit : 'Not played yet', c.x + c.w / 2, c.y + 252, 14, '#ffd45c');
      label('▶ PLAY', c.x + c.w / 2, c.y + 274, 13, `rgba(255,255,255,${0.55 + 0.35 * Math.sin(this.t * 4)})`, 'center', '800');
    }
    label('Click / tap a game  ·  or press 1, 2, 3  ·  Esc returns here', W / 2, 500, 14, '#e8ffe0');
    label('A playful jungle parody. No animals were harmed — the pangolin rolls up for fun.', W / 2, 522, 12, 'rgba(232,255,224,0.75)', 'center', '500');
  }
};

// ============================================================
//  SCENE MANAGER, INPUT, LOOP
// ============================================================
let scene = menu;
function go(s) { scene = s; s.enter(); }
const BACK = [12, 12, 96, 36], MUTE = [W - 52, 12, 40, 36];
const inRect = (x, y, r) => x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3];
function drawUI() {
  if (scene !== menu) { ctx.fillStyle = 'rgba(16,44,26,0.75)'; rr(...BACK, 10); ctx.fill(); label('◀ Menu', BACK[0] + 48, BACK[1] + 18, 15, '#fff'); }
  ctx.fillStyle = 'rgba(16,44,26,0.75)'; rr(...MUTE, 10); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 2;
  const mx = MUTE[0] + 12, my = MUTE[1] + 18;
  ctx.beginPath(); ctx.moveTo(mx - 4, my - 4); ctx.lineTo(mx, my - 4); ctx.lineTo(mx + 6, my - 9); ctx.lineTo(mx + 6, my + 9); ctx.lineTo(mx, my + 4); ctx.lineTo(mx - 4, my + 4); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  if (muted) { ctx.moveTo(mx + 10, my - 5); ctx.lineTo(mx + 18, my + 5); ctx.moveTo(mx + 18, my - 5); ctx.lineTo(mx + 10, my + 5); }
  else { ctx.arc(mx + 8, my, 5, -0.9, 0.9); ctx.moveTo(mx + 14, my - 8); ctx.arc(mx + 8, my, 10, -0.9, 0.9); }
  ctx.stroke();
}
function toggleMute() { muted = !muted; store.set('muted', muted); }
function toLogical(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - offX) / scale, (e.clientY - r.top - offY) / scale]; }

let ptr = false;
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const [x, y] = toLogical(e);
  if (inRect(x, y, MUTE)) { toggleMute(); return; }
  if (scene !== menu && inRect(x, y, BACK)) { go(menu); return; }
  ptr = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  try { audio(); } catch (_) {}
  scene.down(x, y);
});
const ptrUp = e => { if (!ptr) return; ptr = false; scene.up(); };
cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp);
cv.addEventListener('contextmenu', e => e.preventDefault());
let keyHeld = false;
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (e.repeat || keyHeld) return; keyHeld = true; try { audio(); } catch (_) {} scene.down(-1, -1); }
  else if (e.code === 'Escape') go(menu);
  else if (e.code === 'KeyM') toggleMute();
  else if (scene === menu && ['Digit1', 'Digit2', 'Digit3'].includes(e.code)) go(SCENES[GAMES[+e.code.slice(-1) - 1].id]);
});
addEventListener('keyup', e => { if ((e.code === 'Space' || e.code === 'Enter') && keyHeld) { keyHeld = false; scene.up(); } });
addEventListener('blur', () => { if (ptr || keyHeld) { ptr = keyHeld = false; scene.up(); } });

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0d1f14'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (offY > 70) { // portrait phone: nudge the player to rotate
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    label('↻  Turn your phone sideways for a bigger jungle', innerWidth / 2, offY / 2, 15, '#e8ffe0');
  }
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  scene.update(dt); scene.draw(); drawUI();
  ctx.restore();
  requestAnimationFrame(frame);
}
menu.enter();
requestAnimationFrame(frame);
// test hook (harmless in production)
window.__rimba = { go: id => go(SCENES[id] || menu), get scene() { return scene; } };
</script>
